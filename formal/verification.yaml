  spec_section: '3.28'
  adrs:
  - ADR-012
  - ADR-014
  kind: safety
  formalization: planned
  formalization_note: A future formula must constrain every global control transition to workflow-authorized semantics while
    permitting runtime results to select among declared continuations and independent agents to exercise declared local
    authority. Progression after a raw-LLM result or independent-agent normal completion is conditional on that event and
    does not assert that it universally occurs. The formula must not assert one enabled transition, output, schedule, trace,
    replay, resource budget, or termination guarantee. The existing planned property name is retained for GitHub Issue 1's
    property-level review and must not be read as exhaustive.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
