schema_version: 2
project: TURNLOCK
policy:
  governing_adr: ADR-015
  normative_spec: docs/specification/turnlock-spec.md
  formal_model:
    module: Turnlock
    path: formal/Turnlock.tla
    status: not-yet-introduced
  mapping_view: docs/formal/invariant-mapping.md
  mapping_view_generated: true
  integrated_model_required: true
  focused_models_are_substitutes_for_integrated: false
  default_semantic_change_checks:
  - relevant-focused
  - integrated-smoke
  integrated_profiles:
  - name: integrated-smoke
    path: formal/models/integrated/smoke.cfg
    status: planned
    intent: All currently formalized core execution forms under small finite bounds for fast cross-feature feedback.
  - name: integrated-standard
    path: formal/models/integrated/standard.cfg
    status: planned
    intent: All currently formalized core execution forms under ordinary CI bounds.
  - name: integrated-stress
    path: formal/models/integrated/stress.cfg
    status: planned
    intent: Larger deliberately expensive integrated exploration.
  result_artifacts:
    directory: formal/results
    schema: formal/tlc-result.schema.json
    purpose: Record what TLC actually checked for a concrete repository revision; verification claims are derived from run
      evidence, not from manifest intent alone.
    required_identity:
    - commit_sha
    - model_config
    - tla_module
    - tool
    - tool_version
    - started_at
    - finished_at
    required_verification_evidence:
    - outcome
    - checked_properties
    - invariant_ids
    - finite_bounds
  traceability_requirements:
    prose_to_formal: Every formally applicable invariant maps to one or more TLA+ properties once modeled.
    formal_mechanism_mapping: Modeled invariants may record the TLA+ state variables and actions/transitions on which their
      properties depend.
    reverse_traceability: The mapping must be mechanically invertible from TLA+ property/action/state variable to affected
      invariant IDs.
    modeled_reference_validation: Once an invariant is marked modeled or checked, referenced TLA+ modules, properties, state
      variables, actions, and TLC configs must exist.
    checked_requires_run_evidence: An invariant may be marked checked only when matching TLC result artifacts exist for the
      declared required configs and repository revision/policy.
    semantic_correspondence_reviewed: Machine validation proves link consistency, not that a TLA+ formula faithfully captures
      prose intent; semantic correspondence remains a review obligation.
status_vocabulary:
  formal_model:
    not-yet-introduced: The governed executable model path must not exist.
    introduced: The governed executable model path exists; this does not imply complete mappings or successful TLC verification.
  integrated_profile:
    planned: The governed TLC configuration is intended but its path has not yet been introduced.
    introduced: The governed TLC configuration path exists; this does not imply a successful TLC run.
  formalization:
    planned: Formalization is applicable and intended but not yet encoded.
    partial: Only a formally meaningful subset of the prose invariant is intended for TLA+.
    not-applicable: The invariant is intentionally outside the core TLA+ state-machine scope.
  verification:
    not-yet-modeled: No corresponding executable TLA+ property has yet been introduced.
    modeled: Corresponding TLA+ property exists but has not yet been recorded as successfully checked.
    checked: At least the declared TLC configurations have successfully checked the property at their stated finite bounds.
    blocked: Formalization/checking is currently blocked and requires an explicit reason.
  mapping:
    pending-model: Formal names may be planned, but state/action dependencies are not yet bound to executable TLA+ identifiers.
    mapped: The invariant is bound to executable TLA+ properties and any declared state/action dependencies.
    not-applicable: No core TLA+ mapping is intended.
