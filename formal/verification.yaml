  formalization_note: The abstract model can demonstrate composition/reachability of the required execution forms, including main-agent continuation inside workflow-owned parallel topology subject to TL-INV-039, recursive/cyclic composition through ordinary workflow invocation, and explicitly delegated independent-agent-selected nested invocation subject to TL-INV-040; it cannot prove universal adequacy for every real workflow. Finite workflow sets or recursion bounds in a concrete model are modeling choices and must not become mandatory parent-enumerated callee whitelists or TURNLOCK product recursion limits.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
