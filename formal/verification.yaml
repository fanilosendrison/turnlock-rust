- id: TL-INV-024
  title: Heterogeneous parallel composition invariant
  spec_section: 3.22A
  adrs:
  - ADR-013
  - ADR-032
  kind: safety+reachability
  formalization: planned
  formalization_note: A future model must permit main-agent continuation as a heterogeneous workflow-owned parallel branch while preserving branch-specific semantics. Main-agent handoff is branch-local, and concurrent lineage non-forkability is owned separately by TL-INV-039. Silent serialization must not be modeled as a conforming repair for unordered uses of the same main-agent lineage.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
    - name: MixedBranchTypesCanCoexist
      status: planned
    - name: MixedBranchSemanticsPreserved
      status: planned
    - name: MainAgentCanParticipateInParallelRegion
      status: planned
    state_variables: []
