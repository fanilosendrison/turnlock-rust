- id: TL-INV-036
  title: Effective execution-condition provenance invariant
  spec_section: '3.34'
  adrs:
  - ADR-024
  - ADR-025
  - ADR-026
  kind: safety+semantic-boundary+conformance
  formalization: partial
  formalization_note: A future abstract model can represent that an effective condition TURNLOCK selects, binds, explicitly
    supplies, or resolves governs an execution scope, preserve that attribution instead of substituting unrelated later
    state, and distinguish unknown or unavailable provenance from a known condition occurrence bound to its governed scope,
    including a protected state that is not substituted by generic loss before or during the required realizable capture
    handoff. It can also represent that an owed provenance obligation cannot be irreversibly lost before its abstract capture
    handoff is discharged, where discharge abstracts completion of TURNLOCK's side of a semantic-boundary interaction through
    a structurally realizable capture capability and does not require actual consumer participation, successful delivery, or
    acknowledgment. This invariant alone imposes no post-handoff availability requirement. The abstraction
    must not imply post-handoff lifetime, exact-value disclosure, stable cross-run identity, underlying-value equality and
    difference evidence, delivery acknowledgment, persistence, retention, or a concrete capture mechanism. TLA+ cannot
    establish real provider, harness, or adapter metadata exposure, protection against information leakage, semantic
    sufficiency at a concrete boundary, authorization, privacy, serialization, storage, retention, or UI behavior. No
    property, state variable, action, or config identifier is recorded before the executable shared model introduces it.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties: []
    state_variables: []
    actions: []
    focused_configs: []
    integrated_configs: []
  implementation:
    tests: []
- id: TL-INV-037
  title: Active-invocation governing-definition stability invariant
  spec_section: '3.35'
  adrs:
  - ADR-027
  - ADR-028
  - ADR-029
  - ADR-033
  kind: safety
  formalization: planned
  formalization_note: A future abstract model must represent that once an invocation is accepted with governing definition D, that
    governing definition remains unchanged while the invocation is active. Every transition represented by the current accepted
    model that would change an active invocation's governing definition from D to another definition D' must violate the modeled
    TL-INV-037 safety property; the model must not provide an authorization-gated or otherwise reserved exception path. A nested
    invocation J, including a recursive/cyclic descendant that revisits an ancestor workflow identity, has its own governing
    definition determined for J; caller acceptance does not imply a transitive root/run-wide snapshot, and a descendant binding
    that differs from an active ancestor binding is not rebinding of that ancestor. Active replanning, active rebinding, and replacement of an accepted invocation's governing definition are outside
    and contrary to the current product contract, so no transition, guard, or placeholder may be reserved for them. Runtime
    results may select among continuations the governing definition already authorizes, but selecting a declared possibility is
    not a change to the governing definition. The abstraction must not select or imply a revision mechanism, hash, snapshot
    representation, copy mechanism, storage choice, lock mechanism, authorization implementation, replay implication, or
    reproducibility implication. The ADR-029 responsibility boundary that general filesystem, tool, OS, repository, and sandbox
    permissions belong to the surrounding execution environment is formalization-not-applicable, so the model must not introduce
    permission or meta-workflow state such as workflowWritePermission, metaWorkflow, AuthorizedMutation, or ReplanPermission, or
    any equivalent. TLA+ cannot establish real filesystem edit semantics, what counts as invocation acceptance in a concrete
    harness, or which local restrictions the environment supplies. No property, state variable, action, or config identifier is
    recorded before the executable shared model introduces it.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties: []
    state_variables: []
    actions: []
    focused_configs: []
    integrated_configs: []
  implementation:
    tests: []
