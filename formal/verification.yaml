- id: TL-INV-025
  title: Independent-agent first-class invariant
  spec_section: '3.23'
  adrs:
  - ADR-011
  - ADR-020
  - ADR-021
  - ADR-034
  kind: reachability+safety
  formalization: planned
  formalization_note: A future formalization must preserve a fresh distinct independent-agent lineage, a workflow-declared semantic mission, autonomous multi-turn local authority, recognizable normal completion if reached, optional contract output, possible persistent effects, and workflow-owned continuation. Workflow semantics may explicitly delegate nested-workflow selection/invocation authority as local IA authority; that capability must not be implicit in independent-agent status or technical shell/tool access. The abstraction may permit dynamic callee selection and must not encode universal parent enumeration of exact callee identities as a TURNLOCK Core requirement. Delegated invocation must remain distinct from global orchestration ownership and from composition admissibility. TL-INV-040 separately owns the no-session-main-lineage restriction for IA-selected invocation subtrees. The model must not introduce a generic ACL/RBAC/capability-token system, concrete resource limit, or universal completion guarantee.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
    - name: IndependentAgentCanBeWorkflowDeclared
      status: planned
    - name: IndependentAgentHasDistinctLineage
      status: planned
    - name: IndependentAgentCanReceiveDelegatedNestedInvocationAuthority
      status: planned
    state_variables: []
    actions: []
    focused_configs: []
    integrated_configs: []
  implementation:
    tests: []
