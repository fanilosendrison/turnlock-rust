- id: TL-INV-028
  title: Raw-LLM inference invariant
  spec_section: '3.26'
  adrs:
  - ADR-012
  kind: reachability+safety
  formalization: planned
  formalization_note: A future formalization must preserve one declared non-agentic semantic operation with explicit
    instruction and context, no autonomous agent loop or persistent independent lineage, a result boundary if and when
    the operation completes, and no global orchestration authority. The semantic boundary does not mean one physical provider request or attempt,
    select a concrete turn, token, tool-call, cost, time, retry, or other resource limit, or assert universal completion.
    Existing planned property names remain non-exhaustive inputs to Issue 1's property-level review.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
    - name: RawLLMIsBoundedLeaf
