  - ADR-020
  kind: semantic-boundary
  formalization: partial
  formalization_note: TLA+ can represent that a workflow-declared independent agent has a distinct lineage, receives no
    implicit main-agent cognitive context, and begins with cognitive context supplied explicitly through workflow semantics.
    It cannot prove semantic sufficiency or quality, govern children spawned only through local main-agent delegation, or
    select a context API, representation, serialization, quantitative context limit, or resource budget.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
