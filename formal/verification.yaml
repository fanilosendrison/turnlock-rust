schema_version: 3
project: TURNLOCK
authority:
  normative_spec: docs/specification/turnlock-spec.md
  architecture_decisions:
    - ADR-015
    - ADR-041
  abstraction_constraints:
    - ADR-040
policy:
  formal_semantic_domains:
    - id: operational
      representation: tla+
      module: Turnlock
      path: formal/Turnlock.tla
      integrated_semantics_required: true
      focused_analyses_are_restrictions: true
  behavioral_modalities:
    - safety
    - reachability
    - liveness
  assurance_domains:
    - formal-behavioral
    - conformance
    - architecture
    - semantic-quality
  hostile_review:
    evidence_directory: formal/reviews
    evidence_schema: formal/reviews/meta-schemas/review-evidence-v5.schema.json
    current_protocol_bundle:
      path: formal/reviews/protocols/gate-a-campaign-protocol-v4.json
      sha256: f059401f092a9133fb5729db5d0f7b94346c52389bcd4deb81583152ad3b09ac
    minimum_independent_reviewers: 2
    majority_vote_sufficient: false
    required_attack_objectives:
      assurance-decomposition:
        - semantic-strengthening
        - semantic-weakening
        - omitted-valid-behavior
        - invented-behavior
        - collapsed-normative-distinction
        - invented-formal-distinction
        - hidden-assumption
        - wrong-quantification
        - wrong-occurrence-scope
        - modality-mismatch
        - vacuity
        - coverage-gap
        - alternative-compatible-interpretation
        - cross-feature-interaction-failure
  mechanical_evidence:
    tlc:
      evidence_directory: formal/results
      evidence_schema: formal/tlc-result.schema.json
      exact_executed_artifact_identity_required: true
  readiness_gates:
    - id: formal-architecture-ready
      authorizes: candidate-formal-model-authoring
    - id: canonical-formal-semantics-ready
      authorizes: canonical-formal-semantic-promotion
    - id: formal-verification-ready
      authorizes: verification-evidence-lifting
claims:
  - id: TL-CLAIM-001
    statement: >-
      Every change in global control of an active workflow is authorized by executable workflow semantics; neither TURNLOCK nor an execution resource invents an undeclared global continuation or topology.
    normative_sources:
      - TL-INV-001
      - TL-INV-002
      - TL-INV-013
      - TL-INV-030
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-002
    statement: >-
      Declared non-agentic workflow control can progress without requiring the main agent to act as the global scheduler or reconstruct missing orchestration.
    normative_sources:
      - TL-INV-001
      - TL-INV-013
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-003
    statement: >-
      Probabilistic, nondeterministic, external, LLM-produced, or agent-produced results can select among continuations already authorized by executable workflow semantics without acquiring global orchestration authority.
    normative_sources:
      - TL-INV-002
      - TL-INV-003
      - TL-INV-030
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-004
    statement: >-
      A mechanical step progresses only according to its executable semantics and available runtime inputs, results, state, or events, or produces a defined non-success outcome; it does not require an agent to supply an orchestration decision absent from those semantics.
    normative_sources:
      - TL-INV-003
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-005
    statement: >-
      A handoff to the main agent preserves the continuation capability and workflow state required for later workflow resumption.
    normative_sources:
      - TL-INV-004
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-006
    statement: >-
      For every nonterminal main-agent step, a workflow-to-main-agent-to-workflow control path is admissible.
    normative_sources:
      - TL-INV-004
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-007
    statement: >-
      A workflow can represent more than one main-agent step or handoff; the architecture does not impose a single-handoff limit.
    normative_sources:
      - TL-INV-005
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-008
    statement: >-
      While a main-agent region is active, the workflow remains the enclosing execution and local agent autonomy does not redefine the workflow's remaining declared progression.
    normative_sources:
      - TL-INV-006
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-009
    statement: >-
      Sufficient workflow execution state and the correct continuation remain represented independently of the main agent's conversational recollection so workflow resumption does not require reconstruction from agent memory.
    normative_sources:
      - TL-INV-007
      - TL-INV-010
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-010
    statement: >-
      Acceptance of a workflow invocation preserves a structured return relation carrying the appropriate continuation to that invocation's exact immediate caller context.
    normative_sources:
      - TL-INV-008
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-011
    statement: >-
      Normal completion of an invocation returns that exact invocation occurrence to the same immediate caller context and authorizes only the continuation appropriate to that caller.
    normative_sources:
      - TL-INV-008
      - TL-INV-018
      - TL-INV-019
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-012
    statement: >-
      A TURNLOCK main-agent continuation preserves one continuing abstract main-agent lineage rather than silently replacing it with a distinct independent-agent lineage.
    normative_sources:
      - TL-INV-009
      - TL-INV-014
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-013
    statement: >-
      A concrete harness realization presented as a TURNLOCK main-agent step preserves the required interactive and cognitive-lineage continuity, and any weaker capability is explicitly identified as weaker rather than represented as equivalent.
    normative_sources:
      - TL-INV-009
      - TL-INV-014
    assurance_domain: conformance
  - id: TL-CLAIM-014
    statement: >-
      Every harness declared supported by TURNLOCK realizes the same abstract TURNLOCK workflow semantics; harness-specific mechanisms or capability limitations do not silently redefine those semantics.
    normative_sources:
      - TL-INV-011
      - TL-INV-022
    assurance_domain: conformance
  - id: TL-CLAIM-015
    statement: >-
      Mechanical execution, raw LLM inference, independent-agent execution, and main-agent continuation remain semantically distinct execution forms.
    normative_sources:
      - TL-INV-012
      - TL-INV-028
      - TL-INV-029
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-016
    statement: >-
      A concrete realization claiming one TURNLOCK cognitive execution form satisfies that form's contract rather than silently substituting another form.
    normative_sources:
      - TL-INV-012
      - TL-INV-028
    assurance_domain: conformance
  - id: TL-CLAIM-017
    statement: >-
      A concrete implementation does not delegate hidden global scheduling or workflow reconstruction to an agent while claiming workflow-owned orchestration or independent workflow execution.
    normative_sources:
      - TL-INV-013
      - TL-INV-032
    assurance_domain: conformance
  - id: TL-CLAIM-018
    statement: >-
      A main-agent step restores the ordinary interactive coding-agent behavior required by that region and is not reduced to a stateless or one-shot request/response mechanism.
    normative_sources:
      - TL-INV-015
    assurance_domain: conformance
  - id: TL-CLAIM-019
    statement: >-
      Whenever the session main agent owns control, TURNLOCK workflows available to that session remain invocable, including when that control was reached through a main-agent region of another workflow.
    normative_sources:
      - TL-INV-016
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-020
    statement: >-
      An accepted nested invocation suspends and preserves its immediate caller rather than discarding, replacing, or implicitly completing that caller.
    normative_sources:
      - TL-INV-017
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-021
    statement: >-
      Accepted invocation occurrences remain distinct even when a workflow identity repeats through recursive or cyclic invocation.
    normative_sources:
      - TL-INV-017
      - TL-INV-018
      - TL-INV-035
      - TL-INV-037
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-022
    statement: >-
      A recursive or cyclic workflow invocation can be admitted when otherwise authorized and admissible; equality with or reachability to an ancestor workflow identity is not itself a rejection condition.
    normative_sources:
      - TL-INV-017
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-023
    statement: >-
      A nested callee cannot replace, rewrite, capture, skip, or implicitly complete an ancestor invocation's preserved continuation or declared progression.
    normative_sources:
      - TL-INV-019
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-024
    statement: >-
      Workflows authored directly by developers and workflows authored or modified by coding agents target the same semantic workflow artifact and execution model.
    normative_sources:
      - TL-INV-020
    assurance_domain: conformance
  - id: TL-CLAIM-025
    statement: >-
      TURNLOCK author-facing primitives directly express TURNLOCK control concepts so workflow authors do not need to encode harness-internal control mechanisms.
    normative_sources:
      - TL-INV-021
    assurance_domain: architecture
  - id: TL-CLAIM-026
    statement: >-
      TURNLOCK semantics remain independent of any one coding harness, and Pi-specific or other reference-harness mechanics do not become normative merely because they are implemented first.
    normative_sources:
      - TL-INV-022
      - TL-INV-023
    assurance_domain: architecture
  - id: TL-CLAIM-027
    statement: >-
      Workflow-owned parallel fan-out and fan-in can represent independent semantic work, including admissible heterogeneous branch types and main-agent continuation.
    normative_sources:
      - TL-INV-024
      - TL-INV-027
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-028
    statement: >-
      Parallel composition preserves each branch type's lifecycle, context, authority, completion, effects, lineage, and declared output semantics while fan-out, synchronization, collection, join, and continuation remain workflow-owned.
    normative_sources:
      - TL-INV-024
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-029
    statement: >-
      A main-agent handoff reached inside one parallel branch is local to that branch and does not implicitly suspend unrelated sibling branches that remain enabled by the declared topology.
    normative_sources:
      - TL-INV-024
      - TL-INV-027
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-030
    statement: >-
      Completion of one branch, including a main-agent branch, cannot make a post-join continuation eligible before the declared join requirements are satisfied.
    normative_sources:
      - TL-INV-024
      - TL-INV-027
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-031
    statement: >-
      When the declared requirements of a particular join occurrence are satisfied, its declared post-join continuation becomes eligible according to the workflow topology; eventual advancement is a separate liveness obligation.
    normative_sources:
      - TL-INV-027
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-032
    statement: >-
      A nested workflow invocation can occur as branch-local composition inside an admissible parallel or otherwise restricted context and is not treated as a separate parallel execution form.
    normative_sources:
      - TL-INV-024
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-033
    statement: >-
      A workflow can directly declare an independent-agent execution region without yielding to the main agent solely to create an agent already required by the workflow topology.
    normative_sources:
      - TL-INV-025
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-034
    statement: >-
      Each workflow-declared independent-agent occurrence has a fresh cognitive lineage distinct from the session main-agent lineage.
    normative_sources:
      - TL-INV-025
      - TL-INV-026
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-035
    statement: >-
      An independent-agent region may exercise its declared local semantic and discretionary authority without acquiring ownership of enclosing global workflow orchestration.
    normative_sources:
      - TL-INV-025
      - TL-INV-030
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-036
    statement: >-
      Workflow semantics can explicitly delegate local nested-workflow selection and invocation authority to an independent agent, including dynamic selection without a universal requirement to pre-enumerate every exact callee identity.
    normative_sources:
      - TL-INV-025
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-037
    statement: >-
      Independent-agent status, local judgment, tool or shell access, TURNLOCK access, workflow visibility, or knowledge of a workflow do not by themselves grant TURNLOCK semantic authority to create a nested workflow invocation.
    normative_sources:
      - TL-INV-025
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-038
    statement: >-
      Delegated independent-agent nested-invocation authority does not transfer ownership of enclosing sequencing, branching, fan-out, synchronization, join, continuation, or main-agent transitions.
    normative_sources:
      - TL-INV-025
      - TL-INV-030
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-039
    statement: >-
      If an independent-agent occurrence reaches normal completion, TURNLOCK recognizes that completion, follows the workflow-declared continuation, and makes any output required by the region contract available.
    normative_sources:
      - TL-INV-025
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-040
    statement: >-
      A concrete independent-agent realization provides autonomous multi-turn local behavior compatible with the region's declared mission, distinct lineage, and available local authority.
    normative_sources:
      - TL-INV-025
    assurance_domain: conformance
  - id: TL-CLAIM-041
    statement: >-
      The initial cognitive context of a workflow-declared independent agent contains no implicit inheritance of main-agent cognitive context; semantic inputs from that context are supplied explicitly through workflow semantics.
    normative_sources:
      - TL-INV-026
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-042
    statement: >-
      Concrete independent-agent context construction satisfies the explicit-input and no-implicit-main-context contract.
    normative_sources:
      - TL-INV-026
    assurance_domain: conformance
  - id: TL-CLAIM-043
    statement: >-
      The no-implicit-context rule does not prohibit explicitly supplied main-agent-derived summaries, artifacts, files, or prior results, and does not prohibit an independent agent from acquiring information later through its available capabilities.
    normative_sources:
      - TL-INV-026
    assurance_domain: conformance
  - id: TL-CLAIM-044
    statement: >-
      Raw LLM inference is directly available as a declared bounded non-agentic semantic operation without requiring creation of an autonomous agent loop or a main-agent handoff solely to obtain model intelligence.
    normative_sources:
      - TL-INV-028
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-045
    statement: >-
      A raw LLM inference occurrence has no autonomous observe-reason-act loop, no persistent independent cognitive lineage, and no global workflow-orchestration authority.
    normative_sources:
      - TL-INV-028
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-046
    statement: >-
      A raw LLM inference semantic operation has explicit instruction and context and a result boundary while remaining bounded and non-agentic.
    normative_sources:
      - TL-INV-028
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-047
    statement: >-
      The authoring model preserves the author's ability to choose the least powerful execution form semantically sufficient for a region rather than collapsing all cognitive work into one universal agent step.
    normative_sources:
      - TL-INV-029
    assurance_domain: semantic-quality
  - id: TL-CLAIM-048
    statement: >-
      The required core TURNLOCK execution and control forms are jointly composable so known orchestration decisions can remain executable workflow logic rather than being delegated back to an agent for lack of expressive power.
    normative_sources:
      - TL-INV-031
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-049
    statement: >-
      The authoring and control surface provides a sufficiently small orthogonal set of primitives to express the required workflow space without forcing known decisions back into agent interpretation.
    normative_sources:
      - TL-INV-031
    assurance_domain: architecture
  - id: TL-CLAIM-050
    statement: >-
      The identity or nature of a workflow's author does not confer runtime orchestration authority, and an authored or generated workflow remains independently represented and executed.
    normative_sources:
      - TL-INV-032
    assurance_domain: architecture
  - id: TL-CLAIM-051
    statement: >-
      For an accepted invocation whose normal completion or other terminal or cessation outcome is observed by TURNLOCK, inspection exposes the actual realized execution or realized prefix and only terminal facts TURNLOCK actually knows.
    normative_sources:
      - TL-INV-033
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-052
    statement: >-
      Inspectable execution truth preserves occurrence distinctions and multiplicity, structural and causal relationships, effective control resolutions, and input or result attribution whenever those distinctions are necessary to determine realized progression.
    normative_sources:
      - TL-INV-033
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-053
    statement: >-
      Inspection does not impose an artificial total order on concurrent occurrences that TURNLOCK semantics do not causally order.
    normative_sources:
      - TL-INV-033
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-054
    statement: >-
      Inspection that depends on workflow definition semantics uses the exact governing definition that actually governed the invocation rather than a later mutable workflow definition.
    normative_sources:
      - TL-INV-033
      - TL-INV-037
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-055
    statement: >-
      Required execution truth is not irreversibly lost before a realizable terminal inspection handoff makes a semantically sufficient representation acquirable by an eligible inspection context.
    normative_sources:
      - TL-INV-033
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-056
    statement: >-
      A concrete inspection realization provides a semantically sufficient representation to an eligible inspection context while preserving the distinction between underlying execution truth and a potentially more restrictive consumer-visible disclosure view.
    normative_sources:
      - TL-INV-033
    assurance_domain: conformance
  - id: TL-CLAIM-057
    statement: >-
      TURNLOCK Core defines no universal evaluation objective, universal quality metric, default superiority relation, experiment policy, or autonomous workflow optimizer.
    normative_sources:
      - TL-INV-034
    assurance_domain: architecture
  - id: TL-CLAIM-058
    statement: >-
      Evaluation or optimization behavior receives no privileged runtime authority, and workflow improvement remains authorship rather than active invocation replanning.
    normative_sources:
      - TL-INV-034
    assurance_domain: architecture
  - id: TL-CLAIM-059
    statement: >-
      A workflow-declared invocation can execute directly from declared workflow topology without a main-agent handoff whose only purpose would be to reproduce an invocation decision already present in that topology.
    normative_sources:
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-060
    statement: >-
      A declared nested invocation suspends only the calling continuation associated with that invocation and does not implicitly suspend independently active concurrent contexts allowed to continue by the declared topology.
    normative_sources:
      - TL-INV-035
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-061
    statement: >-
      An attempted invocation rejected before acceptance creates no accepted callee, callee lifetime, governing definition, or call-return episode and does not enable the normal successful post-call continuation.
    normative_sources:
      - TL-INV-035
      - TL-INV-037
      - TL-INV-041
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-062
    statement: >-
      Every effective execution condition that TURNLOCK selects, binds, explicitly supplies, or resolves remains semantically distinguished and attributable to the execution scope it governs until the required semantic-boundary capture handoff.
    normative_sources:
      - TL-INV-036
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-063
    statement: >-
      Required execution-condition provenance is not irreversibly lost before TURNLOCK discharges its side of the realizable semantic-boundary capture handoff.
    normative_sources:
      - TL-INV-036
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-064
    statement: >-
      A concrete provenance-capture boundary is realizable without depending on inaccessible transient internal state or accidental timing, and discharge does not require an actual consumer, successful delivery, processing, or acknowledgment.
    normative_sources:
      - TL-INV-036
    assurance_domain: conformance
  - id: TL-CLAIM-065
    statement: >-
      An execution condition outside TURNLOCK observation or control may remain unknown or unavailable, and unknown provenance is not represented as known-equal across executions or as evidence that no relevant difference exists.
    normative_sources:
      - TL-INV-036
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-066
    statement: >-
      Known but protected execution-condition provenance retains condition-specific information bound to its occurrence and governed scope through the required capture handoff; redaction does not replace that underlying provenance with unknown or with a generic marker as the sole representation.
    normative_sources:
      - TL-INV-036
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-067
    statement: >-
      Later failure, cancellation, or interruption does not retroactively erase a condition's governed-scope attribution or its pre-handoff provenance obligation.
    normative_sources:
      - TL-INV-036
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-068
    statement: >-
      Every accepted invocation has one governing workflow definition no later than acceptance, and that governing definition remains unchanged throughout the invocation's active lifetime without active replanning or rebinding.
    normative_sources:
      - TL-INV-037
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-069
    statement: >-
      Each accepted nested invocation independently binds its own governing definition, and repeated workflow identity does not merge invocation occurrences or their governing bindings.
    normative_sources:
      - TL-INV-037
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-070
    statement: >-
      A descendant or later invocation can bind a resolved governing definition different from an active ancestor's governing definition without rebinding or mutating that ancestor.
    normative_sources:
      - TL-INV-037
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-071
    statement: >-
      For a successfully admitted invocation, the workflow definition whose composition was admitted is exactly the definition bound as governing at acceptance; a rejected attempt binds no governing definition.
    normative_sources:
      - TL-INV-037
      - TL-INV-041
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-072
    statement: >-
      When an execution-relevant realization is not fixed by TURNLOCK semantics and a semantically preserving alternative is technically realizable at runtime, TURNLOCK Core provides a supported runtime composition path for that alternative without requiring Core modification or recompilation.
    normative_sources:
      - TL-INV-038
    assurance_domain: conformance
  - id: TL-CLAIM-073
    statement: >-
      A runtime-supplied realization can become effective before the first causal use it is intended to govern.
    normative_sources:
      - TL-INV-038
    assurance_domain: conformance
  - id: TL-CLAIM-074
    statement: >-
      Once an external realization has been accepted as governing an applicable use, that governed use does not silently execute through a different realization unless applicable TURNLOCK semantics authorize the alternative.
    normative_sources:
      - TL-INV-038
    assurance_domain: conformance
  - id: TL-CLAIM-075
    statement: >-
      The same continuing main-agent cognitive lineage is not admitted into two independently concurrent, non-causally-ordered continuations.
    normative_sources:
      - TL-INV-024
      - TL-INV-039
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-076
    statement: >-
      Multiple uses of the same continuing main-agent lineage remain admissible when declared causal ordering or established mutual exclusion prevents them from becoming unordered concurrent continuations.
    normative_sources:
      - TL-INV-039
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-077
    statement: >-
      An incompatible topology is not made conforming by scheduler order, silent serialization, lineage cloning, execution-form substitution, or invented causal order; when required compatibility cannot be established, the topology or invocation is not admitted.
    normative_sources:
      - TL-INV-039
      - TL-INV-041
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-078
    statement: >-
      Every invocation subtree causally rooted in an independent-agent-selected nested invocation is unable to transitively reach the coding session's existing main-agent cognitive lineage across nested, declared, parallel, recursive, or cyclic composition.
    normative_sources:
      - TL-INV-040
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-079
    statement: >-
      After structured return from an independent-agent-selected invocation subtree and appropriate continuation or completion of its independent-agent caller, the enclosing parent workflow can later select a main-agent continuation through its own declared semantics.
    normative_sources:
      - TL-INV-040
    assurance_domain: formal-behavioral
    modality: reachability
    formal_semantic_domain: operational
  - id: TL-CLAIM-080
    statement: >-
      A nested workflow invocation is accepted only when it is independently authorized and preserves every applicable admissibility restriction; when required compatibility cannot be established at the acceptance boundary, the invocation is rejected.
    normative_sources:
      - TL-INV-024
      - TL-INV-035
      - TL-INV-041
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-081
    statement: >-
      Restrictions whose accepted scope extends into descendant composition remain effective across nested, recursive, and cyclic workflow boundaries, and neither a workflow boundary nor runtime scheduler order resets, weakens, widens, or manufactures admissibility.
    normative_sources:
      - TL-INV-024
      - TL-INV-040
      - TL-INV-041
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-082
    statement: >-
      Acceptance of a caller invocation does not pre-authorize future descendant invocations; every attempted nested invocation occurrence has its own admission boundary.
    normative_sources:
      - TL-INV-041
    assurance_domain: formal-behavioral
    modality: safety
    formal_semantic_domain: operational
  - id: TL-CLAIM-083
    statement: >-
      For every particular TURNLOCK-owned progression occurrence, if that occurrence is eligible and remains continuously eligible and continuously applicable under its governing workflow semantics, TURNLOCK eventually advances that same occurrence.
    normative_sources:
      - TL-INV-042
    assurance_domain: formal-behavioral
    modality: liveness
    formal_semantic_domain: operational
