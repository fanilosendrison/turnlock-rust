- id: TL-INV-035
  title: Declared-invocation invariant
  spec_section: '3.33'
  adrs:
  - ADR-022
  - ADR-023
  - ADR-033
  kind: capability+safety
  formalization: planned
  formalization_note: A future formalization must represent a workflow-declared invocation as authorized by the declared
    topology and executed without an agent handoff solely to reproduce the declared call. It must keep the caller context
    and its preserved return-bearing continuation distinct, suspend only that calling continuation, execute the callee's
    own declared progression, and return to the same immediate caller context on normal completion, making only the
    preserved workflow-declared post-call continuation eligible for that caller. A declared invocation may target a
    workflow already represented among its ancestors; recursive/cyclic occurrences remain distinct ordinary invocations.
    The model must not encode workflow-definition acyclicity as a product requirement, assert universal completion,
    interpret suspension as whole-workflow suspension, disable independently active concurrent contexts permitted by the
    declared topology, or turn a bounded model depth into a product recursion limit. Restricted placement admissibility
    and the general transitive composition-admissibility contract remain separately governed.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
    - name: DeclaredInvocationAuthorizedByWorkflowProgram
      status: planned
    - name: DeclaredInvocationDoesNotRequireAgentHandoff
      status: planned
    - name: OnlyCallingContinuationSuspended
      status: planned
    - name: DeclaredInvocationReturnsToImmediateCaller
      status: planned
    - name: NestedInvocationCannotRewriteOuterContinuation
      status: planned
    - name: DeclaredRecursiveInvocationCanBeAdmitted
      status: planned
