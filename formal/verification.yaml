  formalization_note: A future model must ensure that every represented invocation subtree causally rooted in a nested workflow invocation selected by an independent-agent region under explicitly delegated invocation authority cannot transitively reach the coding session's existing main-agent cognitive lineage. The restriction must persist across represented nested calls, workflow-declared calls, conditions, parallel composition, recursion, and cyclic invocation, and must not be reset by another workflow boundary. The abstraction must distinguish this forbidden nested-subtree reachability from a later workflow-owned main-agent continuation selected by the parent after structured return from the IA-selected call or completion of the IA region. The model may use finite workflows or finite depth as modeling bounds but must not select a graph algorithm, theorem prover, effect system, capability lattice, ACL/RBAC mechanism, mandatory exact-callee whitelist, token representation, scheduler, DSL syntax, Rust type, process model, or harness-specific enforcement mechanism as product semantics.
