- id: TL-INV-030
  title: Workflow-owned-control / probabilistic-result invariant
  spec_section: '3.28'
  adrs:
  - ADR-012
  - ADR-014
  - ADR-029
  - ADR-034
  kind: safety
  formalization: planned
  formalization_note: A future formula must constrain every global control transition to workflow-authorized semantics while permitting runtime results to select among declared continuations and independent agents to exercise declared local authority, including explicitly delegated nested-workflow selection/invocation authority. Exercising that delegated authority must not make the independent agent owner of enclosing sequencing, branching, fan-out, synchronization, continuation, or main-agent escalation. Progression after a raw-LLM result or independent-agent normal completion remains conditional on that event and does not assert universal occurrence. TL-INV-040 separately owns the transitive no-session-main-lineage restriction on IA-selected invocation subtrees. The formula must not assert one enabled transition, output, schedule, trace, replay, resource budget, or termination guarantee.
  verification: not-yet-modeled
  tla:
    mapping_status: pending-model
    module: Turnlock
    properties:
    - name: ProbabilisticLeafCannotOwnGlobalControl
      status: planned
    - name: DelegatedIAInvocationDoesNotOwnGlobalControl
      status: planned
    state_variables: []
    actions: []
    focused_configs: []
    integrated_configs: []
  implementation:
    tests: []
