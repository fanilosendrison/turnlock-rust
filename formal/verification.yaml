    if reached, optional contract output, possible persistent effects, and workflow-owned continuation. It must not treat
    local autonomy as global orchestration authority, equate boundedness with a concrete resource limit, or assert universal
    completion. Issue 1 owns property-level obligation classification and any split or rename.
